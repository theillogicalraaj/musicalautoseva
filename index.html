<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>म्यूजिकल ऑटो सेवा</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>

:root{--red:#e8112d;--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.35)}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%;overflow:hidden;background:#000;font-family:'Poppins',system-ui,sans-serif;color:#fff}

#bg,#rainBg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transition:opacity .45s,filter .6s}#rainBg{opacity:0;pointer-events:none}#rainBg.active{opacity:1}

#bg.ghost{filter:grayscale(1) contrast(1.2) brightness(.6)}

.shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55) 100%),linear-gradient(to bottom,rgba(0,0,0,.35),transparent 30%,transparent 65%,rgba(0,0,0,.55))}



.sound-control{display:flex;align-items:center;gap:5px}

.volume-pair{height:30px;display:flex;align-items:center;gap:3px;padding:2px 5px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(0,0,0,.48);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 10px system-ui,sans-serif}

.volume-pair button{width:23px;height:23px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:17px;line-height:1;cursor:pointer;touch-action:manipulation}

.volume-pair span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}

@media(max-width:640px){.top{left:8px;right:8px;top:max(env(safe-area-inset-top),8px);gap:5px}.sound-control{gap:3px}.volume-pair{height:27px;padding:2px 4px;gap:2px}.volume-pair button{width:21px;height:21px}.top .pill{height:34px;padding:0 9px;font-size:10px}.volume-pair span{min-width:25px;font-size:9px}}

@media(max-width:390px){.top{gap:4px}.sound-control{gap:2px}.top .pill{padding:0 7px;font-size:9px}.volume-pair{gap:1px}.volume-pair button{width:19px;height:19px}}

/* title overlay: responsive and easy to hide without stopping the video */

.hero{position:fixed;top:clamp(72px,11vh,120px);left:0;right:0;text-align:center;pointer-events:none;padding:0 16px;z-index:2;transition:opacity .25s,transform .25s}

.hero.hidden{opacity:0;transform:translateY(-12px);pointer-events:none}

.title-tools{display:flex;justify-content:center;margin-top:12px;pointer-events:auto}

.hide-title{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 11px;background:rgba(0,0,0,.35);color:#fff;font:600 11px 'Mukta',sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}

.show-title{position:fixed;left:12px;top:max(env(safe-area-inset-top),12px);z-index:8;display:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 12px;background:rgba(0,0,0,.55);color:#fff;font:700 12px 'Mukta',sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}

.show-title.visible{display:block}

.title{font-family:'Mukta',sans-serif;font-weight:800;line-height:.95;font-size:clamp(46px,9.2vw,128px);color:var(--red);

  -webkit-text-stroke:clamp(5px,.9vw,12px) #fff;paint-order:stroke fill;transform:rotate(-6deg) skewX(-8deg);

  filter:drop-shadow(5px 6px 0 rgba(0,0,0,.55)) drop-shadow(0 10px 25px rgba(0,0,0,.5));display:inline-block}

.title span{display:block}

.title span:nth-child(2){font-size:.72em}

.sub{margin-top:clamp(14px,2.6vw,34px);font-family:'Mukta',sans-serif;font-weight:700;font-size:clamp(16px,1.7vw,24px);text-shadow:0 2px 10px rgba(0,0,0,.8)}



/* top controls */

.top{position:fixed;top:max(env(safe-area-inset-top),18px);right:18px;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap;max-width:calc(100vw - 20px);justify-content:flex-end}

.pill,.round{background:rgba(20,20,20,.55);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;cursor:pointer;transition:.2s}

.pill{display:flex;align-items:center;gap:9px;padding:0 18px;height:42px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.4px;border-color:rgba(60,220,110,.6)}

.pill i{width:10px;height:10px;border-radius:50%;background:#2ee06b;box-shadow:0 0 10px #2ee06b}

.pill.off{border-color:var(--line);opacity:.75}.pill.off i{background:#777;box-shadow:none}

.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}

.round:hover,.pill:hover{background:rgba(60,60,60,.7)}

.round svg{width:18px;height:18px;fill:#fff}

.skull svg{fill:#ff3050}



/* player */

.player{position:fixed;left:50%;bottom:11vh;transform:translateX(-50%);width:min(480px,92vw);height:86px;border-radius:99px;display:flex;align-items:center;gap:16px;padding:0 20px 0 12px;

  background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.1));border:1.5px solid var(--line);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4);z-index:5}

.disc{position:relative;flex:none;width:66px;height:66px;border-radius:50%;background:repeating-radial-gradient(#111 0 2px,#1d1d1d 2px 4px);box-shadow:0 4px 14px rgba(0,0,0,.6);animation:spin 5s linear infinite;animation-play-state:paused}

.disc.on{animation-play-state:running}

.disc b{position:absolute;inset:17px;border-radius:50%;background:conic-gradient(#ff8a3d,#e8112d,#6a5cff,#2ee0c5,#ff8a3d);border:2px solid #000}

.disc b::after{content:"";position:absolute;inset:40%;border-radius:50%;background:#000}

@keyframes spin{to{transform:rotate(360deg)}}

.meta{flex:1;min-width:0}

.np{font-size:9.5px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.7)}

.song{overflow:hidden;white-space:nowrap;font-weight:600;font-size:15px;margin:1px 0 5px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}

.song span{display:inline-block;padding-left:0}

.song.run span{animation:mq 9s linear infinite;padding-left:100%}

@keyframes mq{to{transform:translateX(-100%)}}

.bar{height:4px;border-radius:9px;background:rgba(255,255,255,.28);cursor:pointer;position:relative}

.bar div{height:100%;width:0;border-radius:9px;background:#fff}

.time{font-size:10.5px;margin-top:6px;color:rgba(255,255,255,.85)}

.ctrl{display:flex;gap:8px;flex:none}

.ctrl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.18);cursor:pointer;display:grid;place-items:center;transition:.15s}

.ctrl button:hover{background:rgba(255,255,255,.32);transform:scale(1.06)}

.ctrl button.main{width:42px;height:42px;background:rgba(255,255,255,.3)}

.ctrl svg{width:16px;height:16px;fill:#fff}

.add{position:fixed;left:50%;bottom:calc(11vh + 98px);transform:translateX(-50%);z-index:5;font-size:12px;padding:6px 14px;height:auto;border-radius:99px}



/* footer */

.live{position:fixed;left:50%;bottom:4.5vh;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 16px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);font-family:'Mukta',sans-serif;z-index:5}

.live i{width:7px;height:7px;border-radius:50%;background:#2ee06b}

.live b{color:#ffb347;font-size:15px}

.signature,.instagram{position:fixed;bottom:4.5vh;z-index:5;display:flex;align-items:center;gap:9px;text-decoration:none;font-size:11px;letter-spacing:1.5px;font-weight:700;color:#fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(120deg,rgba(12,12,12,.72),rgba(35,35,35,.34));border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.28);transition:transform .25s,border-color .25s,*background* .25s}

.signature{left:24px;padding:10px 15px 10px 11px;border-radius:8px 22px 22px 8px}

.signature .sig-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,#ff3150,#ff8b3d);font-size:14px;color:#fff;box-shadow:0 0 16px rgba(255,49,80,.35)}

.signature .sig-copy{display:flex;flex-direction:column;gap:2px}

.signature small{font-size:8px;letter-spacing:2.4px;color:rgba(255,255,255,.55);font-weight:600}

.signature strong{font-size:11px;letter-spacing:1.2px;font-weight:800}

.instagram{right:24px;padding:11px 15px;border-radius:22px;letter-spacing:.4px;font-size:12px}

.instagram .ig-icon{width:19px;height:19px;display:grid;place-items:center;border-radius:6px;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);font-size:13px;font-weight:800}

.signature:hover,.instagram:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.55);background:rgba(15,15,15,.85)}

.toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-20px);background:rgba(0,0,0,.75);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:9;text-align:center;max-width:90vw}

.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:640px){

  .hero{top:clamp(70px,10vh,100px);padding:0 10px}

  .title{font-size:clamp(38px,12vw,76px);-webkit-text-stroke:clamp(3px,.8vw,6px) #fff}

  .sub{font-size:clamp(13px,4vw,18px);margin-top:10px}

  .signature{left:8px;bottom:max(env(safe-area-inset-bottom),10px);padding:6px 8px 6px 6px;gap:6px;letter-spacing:.5px}

  .signature .sig-mark{width:21px;height:21px}.signature small{font-size:6px;letter-spacing:1.2px}.signature strong{font-size:8px;letter-spacing:.4px}

  .instagram{right:8px;bottom:max(env(safe-area-inset-bottom),10px);padding:7px 9px;font-size:10px;gap:5px}

  .instagram .ig-icon{width:16px;height:16px}

  .player{bottom:calc(max(env(safe-area-inset-bottom),10px) + 48px);height:74px;width:calc(100vw - 20px);gap:8px;padding:0 10px}

  .disc{width:48px;height:48px}.disc b{inset:12px}

  .meta{min-width:0}.np{font-size:8px;letter-spacing:1.2px}.song{font-size:12px}.time{font-size:9px;margin-top:4px}

  .ctrl{gap:4px}.ctrl button{width:31px;height:31px}.ctrl button.main{width:35px;height:35px}

  .pill{padding:0 10px;height:36px;font-size:11px;gap:6px}.round{width:36px;height:36px}.top{right:8px;gap:6px}

}

@media(max-width:380px){

  .player{gap:6px;padding:0 7px}.disc{width:40px;height:40px}.disc b{inset:10px}

  .ctrl button{width:28px;height:28px}.ctrl button.main{width:32px;height:32px}

  .song{font-size:11px}.top .round.skull{display:none}

  .instagram{font-size:9px}

}

@media(max-height:500px) and (orientation:landscape){.top{max-width:calc(100vw - 12px);gap:4px}.volume-pair{height:24px}.volume-pair button{width:18px;height:18px}

  .hero{top:54px}.title{font-size:clamp(30px,7vw,54px);-webkit-text-stroke:3px #fff}

  .sub{font-size:12px;margin-top:5px}.title-tools{margin-top:4px}

  .player{bottom:8px;height:64px;width:min(430px,80vw)}.disc{width:46px;height:46px}.disc b{inset:11px}

  .signature,.instagram{bottom:8px}.top{top:8px}

}


/* Compact searchable song picker */
.song-browser-trigger{position:fixed;z-index:8;left:calc(50% + min(240px,46vw) - 104px);bottom:calc(11vh + 98px);height:34px;padding:0 13px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(12,12,12,.72);color:#fff;font:600 11px Poppins,system-ui,sans-serif;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;box-shadow:0 5px 18px #0005}
.song-browser{position:fixed;z-index:12;right:max(4vw,calc(50% - 240px));bottom:calc(11vh + 140px);width:min(340px,92vw);max-height:min(46vh,390px);display:none;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.3);border-radius:18px;background:rgba(14,14,17,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 50px #0009}
.song-browser.open{display:flex}.song-browser-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px 9px}.song-browser-title{font-size:13px;font-weight:700}.song-browser-count{font-size:10px;color:#ddd;margin-top:2px}.song-browser-close{border:0;border-radius:50%;width:28px;height:28px;background:#ffffff20;color:#fff;font-size:19px;cursor:pointer}
.song-search{margin:0 12px 10px;width:calc(100% - 24px);height:36px;padding:0 12px;border:1px solid #ffffff2c;border-radius:10px;background:#ffffff12;color:#fff;outline:none;font:500 12px Poppins,system-ui,sans-serif}.song-search::placeholder{color:#ddd}
.song-list{overflow-y:auto;overscroll-behavior:contain;padding:0 8px 9px;scrollbar-width:thin;scrollbar-color:#ffffff55 transparent}.song-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;border-radius:10px;background:transparent;color:#fff;text-align:left;cursor:pointer;font:500 12px Poppins,system-ui,sans-serif}.song-option:hover,.song-option:focus-visible{background:#ffffff16;outline:none}.song-option.current{background:rgba(232,17,45,.25)}.song-num{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:#ffffff16;font-size:10px;color:#eee}.song-option.current .song-num{background:#e8112d}.song-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song-status{flex:none;font-size:10px;color:#ffb5bf}.song-empty{padding:18px 12px;text-align:center;color:#ddd;font-size:12px}
@media(max-width:600px){.song-browser-trigger{left:auto;right:10px;bottom:calc(max(env(safe-area-inset-bottom),10px) + 126px)}.song-browser{right:10px;bottom:calc(max(env(safe-area-inset-bottom),10px) + 166px);max-height:44vh;width:min(340px,calc(100vw - 20px))}}
@media(max-height:500px) and (orientation:landscape){.song-browser-trigger{bottom:78px}.song-browser{bottom:118px;max-height:52vh}}

</style>

</head>

<body>



<video id="bg" muted src="auto.mp4" autoplay loop playsinline preload="auto"></video>

<video id="rainBg" muted src="rain.mp4" autoplay loop playsinline preload="auto" aria-hidden="true"></video>

<div class="shade"></div>



<div class="top">

  <div class="sound-control"><button class="pill off" id="amb" title="ऑटो की आवाज़ चालू/बंद"><i></i>ऑटो की आवाज़</button><div class="volume-pair" aria-label="ऑटो की आवाज़ का वॉल्यूम"><button type="button" id="autoVolDown" aria-label="ऑटो की आवाज़ कम करें">−</button><span id="autoVolValue">70%</span><button type="button" id="autoVolUp" aria-label="ऑटो की आवाज़ बढ़ाएँ">+</button></div></div><div class="sound-control"><button class="pill off" id="rainToggle" title="बारिश चालू/बंद"><i></i>बारिश</button><div class="volume-pair" aria-label="बारिश की आवाज़ का वॉल्यूम"><button type="button" id="rainVolDown" aria-label="बारिश की आवाज़ कम करें">−</button><span id="rainVolValue">60%</span><button type="button" id="rainVolUp" aria-label="बारिश की आवाज़ बढ़ाएँ">+</button></div></div>

  <button class="round" id="mute" title="Mute / Unmute"><svg viewBox="0 0 24 24" id="muteIc"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>

  <button class="round skull" id="skull" title="Start mooning"><svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 0 0-9 9c0 2.8 1.3 5.2 3.3 6.8V21h3v-2h1.4v2h2.6v-2h1.4v2h3v-3.2A9 9 0 0 0 12 2zM8.5 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm7 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg></button>

</div>



<div class="hero" id="hero">

  <h1 class="title"><span>म्यूज़िकल</span><span>ऑटो</span><span>सेवा</span></h1>

  <p class="sub">आपका स्वागत करती है</p>

  <div class="title-tools"><button class="hide-title" id="hideTitle" type="button" aria-label="शीर्षक छिपाएँ">शीर्षक छिपाएँ ×</button></div>

</div>

<button class="show-title" id="showTitle" type="button" aria-label="शीर्षक दिखाएँ">म्यूज़िकल ऑटो सेवा ✦</button>





<div class="player">

  <div class="disc" id="disc"><b></b></div>

  <div class="meta">

    <div class="np">अभी बज रहा है</div>

    <div class="song" id="song"><span id="songT">—</span></div>

    <div class="bar" id="bar"><div id="fill"></div></div>

    <div class="time" id="time">0:00 / 0:00</div>

  </div>

  <div class="ctrl">

    <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>

    <button id="play" class="main" aria-label="Play/Pause"><svg viewBox="0 0 24 24" id="playIc"><path d="M8 5v14l11-7z"/></svg></button>

    <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>

  </div>

</div>



<button class="song-browser-trigger" id="songBrowserToggle" type="button" aria-expanded="false" aria-controls="songBrowser">♫ सभी गाने <span id="songBrowserButtonCount">…</span></button>
<section class="song-browser" id="songBrowser" aria-label="गानों की सूची">
  <div class="song-browser-head"><div><div class="song-browser-title">अपना गाना चुनें</div><div class="song-browser-count" id="songBrowserCount">गाने लोड हो रहे हैं…</div></div><button class="song-browser-close" id="songBrowserClose" type="button" aria-label="बंद करें">×</button></div>
  <div id="youtubePlayer" style="position:fixed;left:10px;bottom:10px;z-index:7;width:300px;height:170px;max-width:calc(100vw - 20px);border-radius:12px;overflow:hidden;background:#000;box-shadow:0 8px 28px #0008;display:none" aria-label="YouTube music player"></div>
  <input class="song-search" id="songSearch" type="search" placeholder="गाना खोजें…" autocomplete="off" aria-label="गाना खोजें">
  <div class="song-list" id="songList" role="listbox" aria-label="सभी गाने"></div>
</section>

const $ = id => document.getElementById(id);
const autoEngine = new Audio("sounds/auto-engine.mp3");
autoEngine.loop = true; autoEngine.preload = "auto";
const rainSound = new Audio("sounds/rain.mp3");
rainSound.loop = true; rainSound.preload = "auto";
const bg = $('bg'), rainBg = $('rainBg');
let idx = 0, started = false, tracks = PLAYLIST.slice(), ytPlayer = null, ytReady = false, ytLoading = false;
const RESUME_KEY = 'musicalAutoSeva.hindiPlaylist.v1';
const fmt = s => !Number.isFinite(s) ? "0:00" : Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0");
const toast = (m) => { const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),3200); };
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
function setTitle(t){ $('songT').textContent=t; const s=$('song'); s.classList.remove('run'); requestAnimationFrame(()=>{if($('songT').scrollWidth>s.clientWidth)s.classList.add('run');}); }
// A public Hindi Bollywood playlist plays inside the page. YouTube does not permit
// arbitrary song-title search inside an embed, so the embedded playlist controls select tracks.
const YT_PLAYLIST_ID = 'PLNkswAYRbnxX9p9cWIinXkiKVPZfjRZ8b';
function ensurePlayer(autoplay=true){
  $('youtubePlayer').style.display='block';
  if(ytReady && ytPlayer){ if(autoplay) ytPlayer.playVideo(); return; }
  if(ytLoading) return;
  ytLoading=true;
  window.onYouTubeIframeAPIReady = function(){
    ytPlayer = new YT.Player('youtubePlayer', {
      width:'300', height:'170',
      playerVars: { listType:'playlist', list:YT_PLAYLIST_ID, autoplay:autoplay?1:0, controls:1, playsinline:1, rel:0, enablejsapi:1, origin:location.origin },
      events: {
        onReady: function(e){ ytReady=true; ytLoading=false; if(autoplay) e.target.playVideo(); toast('हिंदी गाने अब इसी वेबसाइट पर चलेंगे 🎵'); },
        onStateChange: function(e){ if(e.data===YT.PlayerState.PLAYING){ $('playIc').innerHTML=PAUSE; $('time').textContent='YouTube पर चल रहा है'; } else if(e.data===YT.PlayerState.PAUSED || e.data===YT.PlayerState.ENDED){ $('playIc').innerHTML=PLAY; } },
        onError: function(){ toast('यह playlist embed नहीं हो सकी। दूसरी public playlist चुननी होगी।'); }
      }
    });
  };
  if(!document.querySelector('script[data-youtube-iframe-api]')){const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';tag.dataset.youtubeIframeApi='1';document.head.appendChild(tag);}
}
function renderSongList(){
  const list=$('songList'); if(!list)return;
  const query=($('songSearch').value||'').trim().toLocaleLowerCase();
  const visible=tracks.map((track,originalIndex)=>({track,originalIndex})).filter(x=>x.track.title.toLocaleLowerCase().includes(query));
  $('songBrowserButtonCount').textContent=tracks.length?`(${tracks.length})`:'';
  $('songBrowserCount').textContent=`${tracks.length} हिंदी गानों के नाम • असली playback नीचे YouTube player में`;
  if(!visible.length){list.innerHTML='<div class="song-empty">कोई गाना नहीं मिला। दूसरा नाम खोजें।</div>';return;}
  list.innerHTML='';
  visible.forEach(({track,originalIndex})=>{
    const b=document.createElement('button'); b.type='button'; b.className='song-option'+(originalIndex===idx?' current':'');
    b.setAttribute('role','option'); b.setAttribute('aria-selected',String(originalIndex===idx));
    const n=document.createElement('span'); n.className='song-num'; n.textContent=String(originalIndex+1);
    const name=document.createElement('span'); name.className='song-name'; name.textContent=track.title;
    const status=document.createElement('span'); status.className='song-status'; status.textContent='▶';
    b.append(n,name,status); b.addEventListener('click',()=>{idx=originalIndex;setTitle(track.title);renderSongList();try{localStorage.setItem(RESUME_KEY,JSON.stringify({idx,title:track.title}));}catch(e){} ensurePlayer(true); toast('Player इसी page पर है — playlist के controls से गाना चुनें।');}); list.appendChild(b);
  });
}
function setSongBrowser(open){$('songBrowser').classList.toggle('open',open);$('songBrowserToggle').setAttribute('aria-expanded',String(open));if(open){renderSongList();$('songSearch').focus({preventScroll:true});}}
$('songBrowserToggle').addEventListener('click',()=>setSongBrowser(!$('songBrowser').classList.contains('open')));
$('songBrowserClose').addEventListener('click',()=>setSongBrowser(false)); $('songSearch').addEventListener('input',renderSongList);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setSongBrowser(false)});
document.addEventListener('click',e=>{if($('songBrowser').classList.contains('open')&&!e.target.closest('#songBrowser')&&!e.target.closest('#songBrowserToggle'))setSongBrowser(false)});
function load(i,autoplay){idx=(i+tracks.length)%tracks.length;const track=tracks[idx];setTitle(track.title);renderSongList();try{localStorage.setItem(RESUME_KEY,JSON.stringify({idx,title:track.title}));}catch(e){} if(autoplay){ensurePlayer(true);toast('गाना इसी page पर चलेगा। Playlist controls से actual track चुनें।')}else toast('चुना गया: '+track.title+' — Play दबाएँ।');}
function play(){ensurePlayer(true);}
function toggle(){if(!ytReady){ensurePlayer(true);return;} const state=ytPlayer.getPlayerState(); if(state===YT.PlayerState.PLAYING){ytPlayer.pauseVideo();$('playIc').innerHTML=PLAY;}else{ytPlayer.playVideo();$('playIc').innerHTML=PAUSE;}}
$('play').onclick=toggle;
$('next').onclick=()=>{if(ytReady)ytPlayer.nextVideo();else ensurePlayer(true);};
$('prev').onclick=()=>{if(ytReady)ytPlayer.previousVideo();else ensurePlayer(true);};
$('bar').onclick=()=>{if(ytReady)toast('Seek करने के लिए नीचे YouTube player की timeline इस्तेमाल करें।');else ensurePlayer(true);};
$('fill').style.width='0%';$('time').textContent='Play दबाएँ';
renderSongList(); setTitle(tracks[0].title);

/* top buttons */

let amb = false;

let rainOn = false;

let autoVolume = 0.7;

let rainVolume = 0.6;

function updateVolumeLabels(){

  $('autoVolValue').textContent = Math.round(autoVolume*100) + '%';

  $('rainVolValue').textContent = Math.round(rainVolume*100) + '%';

}

function setAutoVolume(value){

  autoVolume = Math.max(0, Math.min(1, value));

  autoEngine.volume = autoVolume;

  autoEngine.muted = autoVolume === 0;

  updateVolumeLabels();

}

function setRainVolume(value){

  rainVolume = Math.max(0, Math.min(1, value));

  rainSound.volume = rainVolume;

  rainSound.muted = rainVolume === 0;

  updateVolumeLabels();

}

// Wire up both sets of volume controls (10% per tap).
$('autoVolDown').addEventListener('click', () => setAutoVolume(autoVolume - 0.1));
$('autoVolUp').addEventListener('click', () => setAutoVolume(autoVolume + 0.1));
$('rainVolDown').addEventListener('click', () => setRainVolume(rainVolume - 0.1));
$('rainVolUp').addEventListener('click', () => setRainVolume(rainVolume + 0.1));

// Apply initial levels immediately so both sounds start at their displayed volume.
setAutoVolume(autoVolume);
setRainVolume(rainVolume);

$('amb').onclick = async ()=>{
  amb = !amb;
  $('amb').classList.toggle('off', !amb);
  try {
    if (amb) {
      autoEngine.volume = autoVolume;
      await autoEngine.play();
      toast("ऑटो इंजन की आवाज़ चालू");
    } else {
      autoEngine.pause();
      autoEngine.currentTime = 0;
    }
  } catch (error) {
    amb = false;
    $('amb').classList.add('off');
    toast("ऑटो की आवाज़ नहीं चली — sounds/auto-engine.mp3 फ़ाइल जाँचें।");
    console.error("Auto engine sound failed:", error);
  }
};
$('rainToggle').onclick = async ()=>{
  rainOn = !rainOn;
  $('rainBg').classList.toggle('active', rainOn);
  $('rainToggle').classList.toggle('off', !rainOn);
  try {
    if (rainOn) {
      rainSound.volume = rainVolume;
      await rainSound.play();
      rainBg.play().catch(()=>{});
      toast("बारिश की आवाज़ चालू");
    } else {
      rainSound.pause();
      rainSound.currentTime = 0;
      rainBg.muted = true;
    }
  } catch (error) {
    rainOn = false;
    $('rainToggle').classList.add('off');
    $('rainBg').classList.remove('active');
    toast("बारिश की आवाज़ नहीं चली — sounds/rain.mp3 फ़ाइल जाँचें।");
    console.error("Rain sound failed:", error);
  }
};
$('mute').onclick = ()=>{ toast('YouTube का volume YouTube player में control करें।'); };

$('skull').onclick = ()=>{ const on = bg.classList.toggle('ghost'); $('skull').title = on ? "Stop mooning" : "Start mooning"; };



/* live passenger count */

setInterval(()=>{ $('count').textContent = 10 + Math.floor(Math.random()*4); }, 4000);



/* Load the hosted playlist automatically. Browsers still require a user tap

   before audio with sound can start; the visitor only needs to press Play. */

// The video title can be hidden on demand and restored with the small floating badge.

$('hideTitle').addEventListener('click', ()=>{

  $('hero').classList.add('hidden');

  $('showTitle').classList.add('visible');

});

$('showTitle').addEventListener('click', ()=>{

  $('hero').classList.remove('hidden');

  $('showTitle').classList.remove('visible');

});
