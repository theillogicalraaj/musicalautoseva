<style>

:root{--red:#e8112d;--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.35)}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%;overflow:hidden;background:#000;font-family:'Poppins',system-ui,sans-serif;color:#fff}

#bg,#rainBg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transition:opacity .45s,filter .6s}#rainBg{opacity:0;pointer-events:none}#rainBg.active{opacity:1}

#bg.ghost{filter:grayscale(1) contrast(1.2) brightness(.6)}

.shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55) 100%),linear-gradient(to bottom,rgba(0,0,0,.35),transparent 30%,transparent 65%,rgba(0,0,0,.55))}



/* Compact unified sound pills: label + slider share one clean glass container */
.sound-control{display:flex;align-items:center;gap:0;padding:3px 7px 3px 3px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(8,10,12,.58);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 5px 18px rgba(0,0,0,.14);transition:border-color .25s,background .25s}
.sound-control .pill{background:transparent!important;border:0!important;box-shadow:none!important;white-space:nowrap;padding:0 9px!important;height:29px!important;font-size:11px!important;}
.sound-control .pill i{margin-right:5px}
.sound-control .volume-pair{height:27px;flex:0 0 auto;min-width:0;width:0;max-width:0;opacity:0;overflow:hidden;pointer-events:none;border:0!important;border-left:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;padding:0!important;margin:0!important;backdrop-filter:none!important;gap:5px;transition:width .26s ease,max-width .26s ease,opacity .18s ease,padding .26s ease,border-color .2s ease}
.sound-control .volume-pair input[type=range]{width:76px;max-width:18vw;min-width:48px;flex:0 0 auto}
.sound-control .volume-pair span{min-width:27px;font-size:10px;flex:0 0 auto}
.sound-control:hover .volume-pair,.sound-control:focus-within .volume-pair,.sound-control.is-expanded .volume-pair{width:116px;max-width:40vw;opacity:1;pointer-events:auto;padding:0 0 0 8px!important;border-left:1px solid rgba(255,255,255,.22)!important}
.sound-control:focus-within{border-color:rgba(255,255,255,.75);background:rgba(8,10,12,.76)}
.sound-control .volume-pair input[type=range]::-webkit-slider-thumb{transition:transform .18s,box-shadow .18s}
.sound-control .volume-pair input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25);box-shadow:0 0 0 5px rgba(255,255,255,.15)}

.volume-pair{height:30px;display:flex;align-items:center;gap:3px;padding:2px 5px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(0,0,0,.48);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 10px system-ui,sans-serif}

.volume-pair input[type=range]{width:78px;accent-color:#ff2145;cursor:pointer;writing-mode:horizontal-tb;appearance:auto;touch-action:pan-y}.volume-pair span{min-width:27px;text-align:center;font-variant-numeric:tabular-nums;font-size:10px}
.music-volume-pop{position:fixed;right:104px;top:108px;z-index:1000;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #555;border-radius:16px;background:rgba(12,15,18,.96);backdrop-filter:blur(14px);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-5px);transition:opacity .18s ease,transform .18s ease,visibility .18s}.music-volume-pop.open,.music-volume-pop:hover,.music-volume-pop:focus-within{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0)}.music-volume-pop input{width:125px;max-width:35vw;accent-color:#ff2145;writing-mode:horizontal-tb;touch-action:pan-y}.vehicle-select{max-width:145px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:24px;background:rgba(0,0,0,.55);color:#fff;padding:0 10px;font-weight:700;cursor:pointer}.vehicle-select option{background:#171717;color:white}

@media(max-width:640px){.top{left:8px;right:8px;top:max(env(safe-area-inset-top),8px);gap:5px;flex-wrap:wrap;justify-content:center}.sound-control{padding:2px 5px 2px 2px}.sound-control .pill{height:27px!important;padding:0 6px!important;font-size:10px!important}.sound-control .volume-pair{height:25px;padding-left:5px!important;gap:3px}.sound-control:hover .volume-pair,.sound-control:focus-within .volume-pair,.sound-control.is-expanded .volume-pair{width:104px;max-width:42vw}.sound-control .volume-pair input[type=range]{width:58px;max-width:18vw;min-width:42px}.sound-control .volume-pair span{min-width:22px;font-size:9px}.top .pill{height:34px;padding:0 9px;font-size:10px}}

@media(max-width:390px){.top{gap:4px}.sound-control .pill{padding:0 5px!important;font-size:9px!important}.sound-control:hover .volume-pair,.sound-control:focus-within .volume-pair,.sound-control.is-expanded .volume-pair{width:92px}.sound-control .volume-pair input[type=range]{width:48px;min-width:36px}.sound-control .volume-pair span{min-width:20px;font-size:8px}}

/* title overlay: responsive and easy to hide without stopping the video */

.hero{position:fixed;top:clamp(72px,11vh,120px);left:0;right:0;text-align:center;pointer-events:none;padding:0 16px;z-index:2;transition:opacity .25s,transform .25s}

.hero.hidden{opacity:0;transform:translateY(-12px);pointer-events:none}

.title-tools{display:flex;justify-content:center;margin-top:12px;pointer-events:auto}

.hide-title{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 11px;background:rgba(0,0,0,.35);color:#fff;font:600 11px 'Mukta',sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}

.show-title{position:fixed;left:12px;top:max(env(safe-area-inset-top),12px);z-index:8;display:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 12px;background:rgba(0,0,0,.55);color:#fff;font:700 12px 'Mukta',sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}

.show-title.visible{display:block}

.title{font-family:'Mukta',sans-serif;font-weight:800;line-height:.95;font-size:clamp(42px,7.1vw,94px);color:#f23b52;
  -webkit-text-stroke:clamp(1.5px,.22vw,3px) #fff;paint-order:stroke fill;transform:rotate(-3deg);
  filter:drop-shadow(2px 3px 0 rgba(0,0,0,.58)) drop-shadow(0 7px 18px rgba(0,0,0,.42));display:inline-block;max-width:94vw}

.title span{display:block;white-space:nowrap}
.title span:nth-child(2){font-size:.78em}
@media(max-width:600px){.title{font-size:clamp(36px,10vw,62px);line-height:1.02;-webkit-text-stroke:1.5px #fff}.sub{margin-top:14px}}

.title span:nth-child(2){font-size:.72em}

.sub{margin-top:clamp(14px,2.6vw,34px);font-family:'Mukta',sans-serif;font-weight:700;font-size:clamp(16px,1.7vw,24px);text-shadow:0 2px 10px rgba(0,0,0,.8)}



/* top controls */

.top{position:fixed;top:max(env(safe-area-inset-top),18px);right:18px;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap;max-width:calc(100vw - 20px);justify-content:flex-end}

.pill,.round{background:rgba(20,20,20,.55);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;cursor:pointer;transition:.2s}

.pill{display:flex;align-items:center;gap:9px;padding:0 18px;height:42px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.4px;border-color:rgba(60,220,110,.6)}

.pill i{width:10px;height:10px;border-radius:50%;background:#2ee06b;box-shadow:0 0 10px #2ee06b}

.pill.off{border-color:var(--line);opacity:.75}.pill.off i{background:#777;box-shadow:none}

.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}

.round:hover,.pill:hover{background:rgba(60,60,60,.7)}

.round svg{width:18px;height:18px;fill:#fff}

.skull svg{fill:#ff3050}



/* player */

.player.yt-mini-card{position:fixed;left:auto;right:14px;top:auto;bottom:14px;transform:none;width:min(250px,calc(100vw - 24px));height:auto;border-radius:20px;display:flex;flex-direction:column;gap:0;padding:7px;background:linear-gradient(135deg,rgba(15,20,26,.92),rgba(18,25,34,.88));border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:0 18px 48px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.18);z-index:7;overflow:hidden}
.browser-modes{padding:0 10px 8px!important;}.mode-switch{display:flex;gap:4px;padding:3px 0 6px}.mode-switch button{flex:1;min-width:0;border:1px solid #ffffff35;border-radius:9px;padding:5px 4px;background:#ffffff0c;color:#fff;font:600 9px system-ui;cursor:pointer}.mode-switch button.active{background:#ff1744;color:#fff;border-color:#ff1744}.local-pick{font:9px system-ui;color:#fff;display:none;margin:0 0 5px}.local-pick input{width:100%;font-size:9px;color:#ddd}.local-pick.show{display:block}.yt-mini-head{height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 2px 5px;cursor:grab;touch-action:none;user-select:none;color:#fff;font:700 10px Poppins,system-ui,sans-serif;letter-spacing:.25px}
.yt-brand{display:flex;align-items:center;gap:6px}.yt-brand svg{width:17px;height:17px;fill:#ff1744}.yt-live-dot{width:6px;height:6px;border-radius:50%;background:#ff304f;box-shadow:0 0 9px #ff304f}
#youtubePlayer{width:100%;aspect-ratio:16/9;height:auto;min-height:0;border-radius:11px;overflow:hidden;background:#000;box-shadow:0 4px 14px #0007}
#youtubePlayer iframe{width:100%;height:100%;display:block}
.yt-mini-controls{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 2px 1px;min-width:0}.yt-mini-meta{min-width:0;flex:1}.np{font-size:8px;font-weight:700;letter-spacing:1.3px;color:rgba(255,255,255,.68)}.song{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}.time{font-size:9px;margin-top:3px;color:rgba(255,255,255,.68)}

async function loadHostedSongs(){
  try{
    let r = await fetch(busMode ? './bus-songs.json' : './songs.json',{cache:'no-cache'});
    if(!r.ok && busMode) r = await fetch('./songs.json',{cache:'force-cache'});
    if(!r.ok)throw new Error((busMode?'bus-songs.json':'songs.json')+' HTTP '+r.status);
    const data=await r.json();
    if(!Array.isArray(data))throw new Error('songs.json must be an array');
    localTracks=data.map(x=>{
      if(typeof x==='string'){
        const raw=x.replace(/^\.\//,'');
        const src=raw.includes('/')?raw:('songs/'+raw);
        const file=raw.split('/').pop();
        return {title:decodeURIComponent(file.replace(/\.[^.]+$/,'')),src:new URL(src,document.baseURI).href};
      }
      if(x&&typeof x.src==='string'){
        const raw=x.src.replace(/^\.\//,'');
        return {title:(typeof x.title==='string'&&x.title.trim())?x.title:decodeURIComponent(raw.split('/').pop().replace(/\.[^.]+$/,'')),src:new URL(raw,document.baseURI).href};
      }
      return null;
    }).filter(Boolean);
    if(!localTracks.length)throw new Error('No local tracks');
    tracks=localTracks;idx=Math.floor(Math.random()*localTracks.length);playMode='local';setTitle(localTracks[idx].title);
    $('time').textContent=`Local playlist • ${localTracks.length} गाने`; syncMiniMode();
    renderSongList();
    // Request only the first audio file; never wait for all 58 files to download.
    const a=$('localAudio');a.preload='metadata';a.src=localTracks[idx].src;a.load();
    // Pick a different random starting song on each page visit, but do not force autoplay (browsers block it).
    $('playIc').innerHTML=PLAY;$('time').textContent='Random song ready • Play दबाएँ';updateSeekUI();
  }catch(e){
    console.error(e);localTracks=[];tracks=[];renderSongList();setTitle('Local गाने उपलब्ध नहीं');
    $('time').textContent=location.protocol==='file:'?'START-MUSICAL-AUTO-SEVA.bat चलाएँ':'songs.json नहीं मिला';
    toast(location.protocol==='file:'?'Local music के लिए START-MUSICAL-AUTO-SEVA.bat चलाएँ; file:// से songs.json नहीं पढ़ा जा सकता।':'songs.json या songs/ folder server पर नहीं मिला।');
  }
}

(function makePlayerDraggable(){
  const card=$('musicMiniCard'), handle=card.querySelector('.yt-mini-head');
  let dragging=false,startX=0,startY=0,baseX=0,baseY=0;
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    const r=card.getBoundingClientRect(); dragging=true; startX=e.clientX; startY=e.clientY; baseX=r.left; baseY=r.top;
    card.style.left=r.left+'px'; card.style.top=r.top+'px'; card.style.right='auto'; card.style.bottom='auto'; card.style.transform='none';
    handle.setPointerCapture(e.pointerId); handle.style.cursor='grabbing'; e.preventDefault();

    const r=card.getBoundingClientRect();

    const y=Math.max(4,Math.min(window.innerHeight-r.height-4,baseY+e.clientY-startY));
    card.style.left=x+'px'; card.style.top=y+'px';
  });
  const stop=()=>{dragging=false;handle.style.cursor='grab';};
  handle.addEventListener('pointerup',stop); handle.addEventListener('pointercancel',stop);
  window.addEventListener('resize',()=>{const r=card.getBoundingClientRect();card.style.left=Math.max(4,Math.min(window.innerWidth-r.width-4,r.left))+'px';card.style.top=Math.max(4,Math.min(window.innerHeight-r.height-4,r.top))+'px';card.style.right='auto';card.style.bottom='auto';card.style.transform='none';});
})();

 });
 // Every clickable control gets responsive tap feedback, not only hover animation.
 $$('button,.vehicle-select,.song-browser-trigger,.mode-switch button,.ctrl button').forEach(el=>{
   el.addEventListener('pointerdown',()=>run(el,{scale:.94,duration:100,easing:'easeOutQuad'}));
   el.addEventListener('pointerup',()=>run(el,{scale:[.94,1.06,1],duration:360,easing:'easeOutElastic(1,.6)'}));
   el.addEventListener('pointercancel',()=>run(el,{scale:1,duration:180,easing:'easeOutCubic'}));
 });
 // A soft animated highlight travels across the title periodically.
 const title=$('.hero .title,.title');
 if(title){title.style.backgroundImage='linear-gradient(105deg,currentColor 0%,currentColor 38%,rgba(255,255,255,.98) 50%,currentColor 62%,currentColor 100%)';title.style.backgroundSize='240% 100%';title.style.backgroundClip='text';title.style.webkitBackgroundClip='text';title.style.webkitTextFillColor='transparent';run(title,{backgroundPosition:['100% 0%','-100% 0%'],duration:5200,easing:'linear',loop:true});}
 // Float small UI ornaments gently; do not animate the entire page continuously.
 $$('.round,.vehicle-select').forEach((el,i)=>run(el,{translateY:[0,-2,0],duration:2600+i*250,delay:i*150,easing:'easeInOutSine',loop:true}));
 // Animate music volume pop when it opens, without changing its visibility/audio logic.
 const pop=$('#musicVolumePop');if(pop){new MutationObserver(()=>{if(pop.classList.contains('open')||getComputedStyle(pop).display!=='none')run(pop,{opacity:[0,1],translateY:[-8,0],scale:[.96,1],duration:300,easing:'easeOutCubic'});}).observe(pop,{attributes:true,attributeFilter:['class','style']});}
 // Vehicle change gets a cinematic but brief transition on the player card.
 const vehicle=$('#vehicleSelect'),card=$('#musicMiniCard');if(vehicle)vehicle.addEventListener('change',()=>{if(card)run(card,{filter:['brightness(1)','brightness(1.35)','brightness(1)'],scale:[1,.985,1],duration:520,easing:'easeInOutSine'});});
})();
</script>

<script id="player-position-and-network-recovery">
(()=>{
 const card=document.getElementById('musicMiniCard');
 if(!card)return;
 // A collapsed card always returns to bottom-right; expanded card also stays within the viewport.
 const pinBottomRight=()=>{
   card.style.setProperty('left','auto','important');
   card.style.setProperty('right','max(8px, env(safe-area-inset-right))','important');
   card.style.setProperty('top','auto','important');
   card.style.setProperty('bottom','max(8px, env(safe-area-inset-bottom))','important');
   card.style.setProperty('transform','none','important');
 };
 const normalizePosition=()=>{
   if(card.classList.contains('auto-collapsed')) pinBottomRight();
   else {
     const r=card.getBoundingClientRect();
     if(r.right>innerWidth-4 || r.left<4 || r.bottom>innerHeight-4){pinBottomRight();}
   }
 };
 new MutationObserver(normalizePosition).observe(card,{attributes:true,attributeFilter:['class']});
 window.addEventListener('resize',normalizePosition,{passive:true});
 window.addEventListener('orientationchange',()=>setTimeout(normalizePosition,150),{passive:true});
 card.querySelector('.yt-mini-head')?.addEventListener('click',()=>{
   if(card.classList.contains('auto-collapsed')){card.classList.remove('auto-collapsed');pinBottomRight();}
 });
 // Retry a stalled background video gently; muted autoplay is allowed on most mobile browsers.
 ['bg','rainBg'].forEach(id=>{
   const v=document.getElementById(id); if(!v)return;
   v.preload='metadata'; v.setAttribute('playsinline',''); v.muted=true;
   let retryTimer=0;
   const retry=()=>{
     if(retryTimer)clearTimeout(retryTimer);
     retryTimer=setTimeout(()=>{
       if(v.paused || v.readyState<2){
         try{const p=v.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}
       }
     },3500);
   };
   v.addEventListener('stalled',retry);v.addEventListener('waiting',retry);
   v.addEventListener('canplay',()=>{if(retryTimer)clearTimeout(retryTimer);});
   v.addEventListener('error',()=>{if(retryTimer)clearTimeout(retryTimer);});
 });
 // Avoid pre-downloading a whole playlist on slow connections; load the chosen track on demand.
 const audio=document.getElementById('localAudio');
 if(audio){audio.preload='metadata';audio.setAttribute('playsinline','');}
 normalizePosition();
})();
</script>
