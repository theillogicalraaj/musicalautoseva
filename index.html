<!DOCTYPE html>

<html lang="hi">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>म्यूजिकल ऑटो सेवा</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<style>

:root{--red:#e8112d;--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.35)}

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%;overflow:hidden;background:#000;font-family:'Poppins',system-ui,sans-serif;color:#fff}

#bg,#rainBg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transition:opacity .45s,filter .6s}#rainBg{opacity:0;pointer-events:none}#rainBg.active{opacity:1}

#bg.ghost{filter:grayscale(1) contrast(1.2) brightness(.6)}

.shade{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55) 100%),linear-gradient(to bottom,rgba(0,0,0,.35),transparent 30%,transparent 65%,rgba(0,0,0,.55))}



.sound-control{display:flex;align-items:center;gap:5px}

.volume-pair{height:30px;display:flex;align-items:center;gap:3px;padding:2px 5px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(0,0,0,.48);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:600 10px system-ui,sans-serif}

.volume-pair input[type=range]{width:78px;accent-color:#ff2145;cursor:pointer}.volume-pair span{min-width:27px;text-align:center;font-variant-numeric:tabular-nums;font-size:10px}
.music-volume-pop{position:fixed;right:104px;top:108px;z-index:1000;display:none;align-items:center;gap:8px;padding:10px 13px;border:1px solid #555;border-radius:16px;background:rgba(12,15,18,.96);backdrop-filter:blur(14px)}.music-volume-pop.open{display:flex}.music-volume-pop input{width:125px;accent-color:#ff2145}.vehicle-select{max-width:145px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:24px;background:rgba(0,0,0,.55);color:#fff;padding:0 10px;font-weight:700;cursor:pointer}.vehicle-select option{background:#171717;color:white}

@media(max-width:640px){.top{left:8px;right:8px;top:max(env(safe-area-inset-top),8px);gap:5px}.sound-control{gap:3px}.volume-pair{height:27px;padding:2px 4px;gap:2px}.volume-pair button{width:21px;height:21px}.top .pill{height:34px;padding:0 9px;font-size:10px}.volume-pair span{min-width:25px;font-size:9px}}

@media(max-width:390px){.top{gap:4px}.sound-control{gap:2px}.top .pill{padding:0 7px;font-size:9px}.volume-pair{gap:1px}.volume-pair button{width:19px;height:19px}}

/* title overlay: responsive and easy to hide without stopping the video */

.hero{position:fixed;top:clamp(72px,11vh,120px);left:0;right:0;text-align:center;pointer-events:none;padding:0 16px;z-index:2;transition:opacity .25s,transform .25s}

.hero.hidden{opacity:0;transform:translateY(-12px);pointer-events:none}

.title-tools{display:flex;justify-content:center;margin-top:12px;pointer-events:auto}

.hide-title{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 11px;background:rgba(0,0,0,.35);color:#fff;font:600 11px 'Mukta',sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}

.show-title{position:fixed;left:12px;top:max(env(safe-area-inset-top),12px);z-index:8;display:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 12px;background:rgba(0,0,0,.55);color:#fff;font:700 12px 'Mukta',sans-serif;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}

.show-title.visible{display:block}

.title{font-family:'Mukta',sans-serif;font-weight:800;line-height:.95;font-size:clamp(46px,9.2vw,128px);color:var(--red);

  -webkit-text-stroke:clamp(5px,.9vw,12px) #fff;paint-order:stroke fill;transform:rotate(-6deg) skewX(-8deg);

  filter:drop-shadow(5px 6px 0 rgba(0,0,0,.55)) drop-shadow(0 10px 25px rgba(0,0,0,.5));display:inline-block}

.title span{display:block}

.title span:nth-child(2){font-size:.72em}

.sub{margin-top:clamp(14px,2.6vw,34px);font-family:'Mukta',sans-serif;font-weight:700;font-size:clamp(16px,1.7vw,24px);text-shadow:0 2px 10px rgba(0,0,0,.8)}



/* top controls */

.top{position:fixed;top:max(env(safe-area-inset-top),18px);right:18px;display:flex;gap:8px;align-items:center;z-index:5;flex-wrap:wrap;max-width:calc(100vw - 20px);justify-content:flex-end}

.pill,.round{background:rgba(20,20,20,.55);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;cursor:pointer;transition:.2s}

.pill{display:flex;align-items:center;gap:9px;padding:0 18px;height:42px;border-radius:99px;font-weight:700;font-size:13px;letter-spacing:.4px;border-color:rgba(60,220,110,.6)}

.pill i{width:10px;height:10px;border-radius:50%;background:#2ee06b;box-shadow:0 0 10px #2ee06b}

.pill.off{border-color:var(--line);opacity:.75}.pill.off i{background:#777;box-shadow:none}

.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}

.round:hover,.pill:hover{background:rgba(60,60,60,.7)}

.round svg{width:18px;height:18px;fill:#fff}

.skull svg{fill:#ff3050}



/* player */

.player.yt-mini-card{position:fixed;left:auto;right:14px;top:auto;bottom:14px;transform:none;width:min(250px,calc(100vw - 24px));height:auto;border-radius:20px;display:flex;flex-direction:column;gap:0;padding:7px;background:linear-gradient(135deg,rgba(15,20,26,.92),rgba(18,25,34,.88));border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);box-shadow:0 18px 48px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.18);z-index:7;overflow:hidden}
.browser-modes{padding:0 10px 8px!important;}.mode-switch{display:flex;gap:4px;padding:3px 0 6px}.mode-switch button{flex:1;min-width:0;border:1px solid #ffffff35;border-radius:9px;padding:5px 4px;background:#ffffff0c;color:#fff;font:600 9px system-ui;cursor:pointer}.mode-switch button.active{background:#ff1744;color:#fff;border-color:#ff1744}.local-pick{font:9px system-ui;color:#fff;display:none;margin:0 0 5px}.local-pick input{width:100%;font-size:9px;color:#ddd}.local-pick.show{display:block}.yt-mini-head{height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 2px 5px;cursor:grab;touch-action:none;user-select:none;color:#fff;font:700 10px Poppins,system-ui,sans-serif;letter-spacing:.25px}
.yt-brand{display:flex;align-items:center;gap:6px}.yt-brand svg{width:17px;height:17px;fill:#ff1744}.yt-live-dot{width:6px;height:6px;border-radius:50%;background:#ff304f;box-shadow:0 0 9px #ff304f}
#youtubePlayer{width:100%;aspect-ratio:16/9;height:auto;min-height:0;border-radius:11px;overflow:hidden;background:#000;box-shadow:0 4px 14px #0007}
#youtubePlayer iframe{width:100%;height:100%;display:block}
.yt-mini-controls{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 2px 1px;min-width:0}.yt-mini-meta{min-width:0;flex:1}.np{font-size:8px;font-weight:700;letter-spacing:1.3px;color:rgba(255,255,255,.68)}.song{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}.time{font-size:9px;margin-top:3px;color:rgba(255,255,255,.68)}
.ctrl{display:flex;align-items:center;gap:5px;flex:none}.ctrl button{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.13);color:#fff;cursor:pointer}.ctrl button.main{width:30px;height:30px;background:rgba(255,255,255,.27)}.ctrl svg{width:15px;height:15px;fill:#fff}


.meta{flex:1;min-width:0}

.np{font-size:9.5px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.7)}

.song{overflow:hidden;white-space:nowrap;font-weight:600;font-size:15px;margin:1px 0 5px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}

.song span{display:inline-block;padding-left:0}

.song.run span{animation:mq 9s linear infinite;padding-left:100%}

@keyframes mq{to{transform:translateX(-100%)}}

.bar{height:4px;border-radius:9px;background:rgba(255,255,255,.28);cursor:pointer;position:relative}

.bar div{height:100%;width:0;border-radius:9px;background:#fff}

.time{font-size:10.5px;margin-top:6px;color:rgba(255,255,255,.85)}

.ctrl{display:flex;gap:8px;flex:none}

.ctrl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.18);cursor:pointer;display:grid;place-items:center;transition:.15s}

.ctrl button:hover{background:rgba(255,255,255,.32);transform:scale(1.06)}

.ctrl button.main{width:42px;height:42px;background:rgba(255,255,255,.3)}

.ctrl svg{width:16px;height:16px;fill:#fff}

.add{position:fixed;left:50%;bottom:calc(11vh + 98px);transform:translateX(-50%);z-index:5;font-size:12px;padding:6px 14px;height:auto;border-radius:99px}



/* footer */

.live{position:fixed;left:50%;bottom:4.5vh;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 16px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);font-family:'Mukta',sans-serif;z-index:5}

.live i{width:7px;height:7px;border-radius:50%;background:#2ee06b}

.live b{color:#ffb347;font-size:15px}

.signature,.instagram{position:fixed;bottom:4.5vh;z-index:5;display:flex;align-items:center;gap:9px;text-decoration:none;font-size:11px;letter-spacing:1.5px;font-weight:700;color:#fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(120deg,rgba(12,12,12,.72),rgba(35,35,35,.34));border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.28);transition:transform .25s,border-color .25s,*background* .25s}

.signature{left:24px;padding:10px 15px 10px 11px;border-radius:8px 22px 22px 8px}

.signature .sig-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,#ff3150,#ff8b3d);font-size:14px;color:#fff;box-shadow:0 0 16px rgba(255,49,80,.35)}

.signature .sig-copy{display:flex;flex-direction:column;gap:2px}

.signature small{font-size:8px;letter-spacing:2.4px;color:rgba(255,255,255,.55);font-weight:600}

.signature strong{font-size:11px;letter-spacing:1.2px;font-weight:800}

.instagram{right:24px;padding:11px 15px;border-radius:22px;letter-spacing:.4px;font-size:12px}

.instagram .ig-icon{width:19px;height:19px;display:grid;place-items:center;border-radius:6px;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);font-size:13px;font-weight:800}

.signature:hover,.instagram:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.55);background:rgba(15,15,15,.85)}

.toast{position:fixed;top:78px;left:50%;transform:translate(-50%,-20px);background:rgba(0,0,0,.75);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:9;text-align:center;max-width:90vw}

.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:640px){

  .hero{top:clamp(70px,10vh,100px);padding:0 10px}

  .title{font-size:clamp(38px,12vw,76px);-webkit-text-stroke:clamp(3px,.8vw,6px) #fff}

  .sub{font-size:clamp(13px,4vw,18px);margin-top:10px}

  .signature{left:8px;bottom:max(env(safe-area-inset-bottom),10px);padding:6px 8px 6px 6px;gap:6px;letter-spacing:.5px}

  .signature .sig-mark{width:21px;height:21px}.signature small{font-size:6px;letter-spacing:1.2px}.signature strong{font-size:8px;letter-spacing:.4px}

  .instagram{right:8px;bottom:max(env(safe-area-inset-bottom),10px);padding:7px 9px;font-size:10px;gap:5px}

  .instagram .ig-icon{width:16px;height:16px}

  .player.yt-mini-card{width:min(230px,calc(100vw - 20px));padding:6px;right:10px;bottom:10px}
  .yt-mini-controls{padding-top:7px}.ctrl{gap:4px}.ctrl button{width:29px;height:29px}.ctrl button.main{width:33px;height:33px}

  .pill{padding:0 10px;height:36px;font-size:11px;gap:6px}.round{width:36px;height:36px}.top{right:8px;gap:6px}

}

@media(max-width:380px){

  .player.yt-mini-card{padding:6px}.ctrl button{width:25px;height:25px}.ctrl button.main{width:28px;height:28px}
  .song{font-size:11px}.top .round.skull{display:none}

  .instagram{font-size:9px}

}

@media(max-height:500px) and (orientation:landscape){.top{max-width:calc(100vw - 12px);gap:4px}.volume-pair{height:24px}.volume-pair button{width:18px;height:18px}

  .hero{top:54px}.title{font-size:clamp(30px,7vw,54px);-webkit-text-stroke:3px #fff}

  .sub{font-size:12px;margin-top:5px}.title-tools{margin-top:4px}

  .player.yt-mini-card{bottom:8px;width:min(230px,calc(100vw - 16px));right:8px}

  .signature,.instagram{bottom:8px}.top{top:8px}

}


/* Compact searchable song picker */
.song-browser-trigger{position:fixed;z-index:13;right:clamp(10px,4vw,60px);left:auto;bottom:clamp(118px,16vh,145px);height:32px;padding:0 12px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(12,12,12,.78);color:#fff;font:600 11px Poppins,system-ui,sans-serif;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;box-shadow:0 5px 18px #0005;max-width:calc(100vw - 20px)}
.song-browser{position:fixed;z-index:14;right:clamp(10px,4vw,60px);left:auto;bottom:clamp(158px,21vh,190px);width:min(340px,calc(100vw - 20px));max-height:min(48dvh,390px);display:none;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.3);border-radius:18px;background:rgba(14,14,17,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 50px #0009}
.song-browser.open{display:flex}.song-browser-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px 9px}.song-browser-title{font-size:13px;font-weight:700}.song-browser-count{font-size:10px;color:#ddd;margin-top:2px}.song-browser-close{border:0;border-radius:50%;width:28px;height:28px;background:#ffffff20;color:#fff;font-size:19px;cursor:pointer}
.song-search{margin:0 12px 10px;width:calc(100% - 24px);height:36px;padding:0 12px;border:1px solid #ffffff2c;border-radius:10px;background:#ffffff12;color:#fff;outline:none;font:500 12px Poppins,system-ui,sans-serif}.song-search::placeholder{color:#ddd}
.song-list{overflow-y:auto;overscroll-behavior:contain;padding:0 8px 9px;scrollbar-width:thin;scrollbar-color:#ffffff55 transparent}.song-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;border-radius:10px;background:transparent;color:#fff;text-align:left;cursor:pointer;font:500 12px Poppins,system-ui,sans-serif}.song-option:hover,.song-option:focus-visible{background:#ffffff16;outline:none}.song-option.current{background:rgba(232,17,45,.25)}.song-num{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:#ffffff16;font-size:10px;color:#eee}.song-option.current .song-num{background:#e8112d}.song-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song-status{flex:none;font-size:10px;color:#ffb5bf}.song-empty{padding:18px 12px;text-align:center;color:#ddd;font-size:12px}
@media(max-width:600px){.song-browser-trigger{right:10px;bottom:calc(max(env(safe-area-inset-bottom),10px) + 126px)}.song-browser{right:10px;bottom:calc(max(env(safe-area-inset-bottom),10px) + 166px);max-height:44dvh;width:min(340px,calc(100vw - 20px))}}
@media(max-height:500px) and (orientation:landscape){.song-browser-trigger{bottom:82px}.song-browser{bottom:120px;max-height:52dvh}}

</style>


<style>
/* Compact screenshot-style music player */
.player.yt-mini-card{z-index:9990;width:min(314px,calc(100vw - 24px));right:16px;bottom:16px;padding:8px 9px;border-radius:22px;background:rgba(15,20,26,.94);border:1px solid rgba(255,255,255,.34);}
.yt-mini-head{height:24px;padding:0 3px 6px;font-size:13px}
.yt-brand{gap:7px}.yt-brand svg{width:21px;height:21px}
.mini-mode-switch{display:flex;gap:5px;padding:2px 0 8px}
.mini-mode-switch button{flex:1;min-width:0;border:1px solid #ffffff35;border-radius:12px;padding:8px 5px;background:#ffffff0c;color:#fff;font:700 11px system-ui;cursor:pointer}
.mini-mode-switch button.active{background:#ff1744;color:#fff;border-color:#ff1744}
.yt-mini-controls{gap:7px;padding:6px 2px 2px}.np{font-size:11px;letter-spacing:.4px}.song{font-size:16px;line-height:1.35}.time{font-size:12px}
.ctrl button{width:43px;height:43px}.ctrl button.main{width:51px;height:51px}
#youtubePlayer{max-height:0;overflow:hidden}
.song-browser-trigger{position:static;z-index:auto;display:block;width:100%;height:29px;margin:0 0 6px;padding:0 10px;border:1px solid rgba(255,255,255,.24);border-radius:9px;background:rgba(255,255,255,.08);color:#fff;font:700 11px system-ui;backdrop-filter:none;box-shadow:none;cursor:pointer;max-width:none}
.song-browser{right:16px;bottom:calc(16px + 300px);z-index:10000}
.player.yt-mini-card.youtube-mode #youtubePlayer{max-height:180px;aspect-ratio:16/9;margin:0 0 5px}
.player.yt-mini-card.youtube-mode #youtubePlayer iframe{min-height:160px}
@media(max-width:600px){.song-browser{right:10px;bottom:calc(10px + 300px)}}
@media(max-width:600px){.player.yt-mini-card{width:min(314px,calc(100vw - 20px));right:10px;bottom:10px}.ctrl button{width:40px;height:40px}.ctrl button.main{width:47px;height:47px}}

/* Player auto-hides into a tidy header after 5 seconds; hover/focus restores it. */
.player.yt-mini-card{transition:width .25s ease, padding .25s ease, border-radius .25s ease, opacity .25s ease;}
.player.yt-mini-card.auto-collapsed{width:min(210px,calc(100vw - 24px));padding:7px 9px;border-radius:18px;}
.player.yt-mini-card.auto-collapsed .song-browser-trigger,
.player.yt-mini-card.auto-collapsed .mini-mode-switch,
.player.yt-mini-card.auto-collapsed #youtubePlayer,
.player.yt-mini-card.auto-collapsed .yt-mini-controls{display:none!important;}
.player.yt-mini-card.auto-collapsed .yt-mini-head{height:24px;padding:0 3px;}
.player.yt-mini-card.auto-collapsed .yt-brand:after{content:' • '+attr(data-mode);font-size:10px;color:#ddd;font-weight:600;}
.player.yt-mini-card:focus-within{width:min(314px,calc(100vw - 24px));}
@media(max-width:600px){.player.yt-mini-card.auto-collapsed{width:min(190px,calc(100vw - 20px));}}
</style>

<body>



<video id="bg" muted src="auto.mp4" autoplay loop playsinline preload="auto"></video>

<video id="rainBg" muted src="rain.mp4" autoplay loop playsinline preload="auto" aria-hidden="true"></video>

<div class="shade"></div>



<div class="top">

  <div class="sound-control"><button class="pill off" id="amb" title="ऑटो की आवाज़ चालू/बंद"><i></i>ऑटो की आवाज़</button><div class="volume-pair" aria-label="ऑटो की आवाज़ का वॉल्यूम"><input type="range" id="autoVolumeSlider" min="0" max="100" value="70" aria-label="ऑटो की आवाज़ वॉल्यूम"><span id="autoVolValue">70%</span></div></div><div class="sound-control"><button class="pill off" id="rainToggle" title="बारिश चालू/बंद"><i></i>बारिश</button><div class="volume-pair" aria-label="बारिश की आवाज़ का वॉल्यूम"><input type="range" id="rainVolumeSlider" min="0" max="100" value="60" aria-label="बारिश वॉल्यूम"><span id="rainVolValue">60%</span></div></div>

  <button class="round" id="mute" title="Mute / Unmute"><svg viewBox="0 0 24 24" id="muteIc"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>

  <select id="vehicleSelect" class="vehicle-select" aria-label="वाहन चुनें" title="वाहन/प्लेलिस्ट बदलें"><option value="auto">🛺 ऑटो रिक्शा</option><option value="bus">🚌 बस (जल्द)</option></select>

</div>
<div class="music-volume-pop" id="musicVolumePop"><span>♫ Music</span><input id="musicVolumeSlider" type="range" min="0" max="100" value="80" aria-label="Music volume"><span id="musicVolumeValue">80%</span></div>

<div class="hero" id="hero">

  <h1 class="title"><span>म्यूज़िकल</span><span>ऑटो</span><span>सेवा</span></h1>

async function loadHostedSongs(){
  try{
    const r=await fetch('./songs.json',{cache:'force-cache'});
    if(!r.ok)throw new Error('songs.json HTTP '+r.status);
    const data=await r.json();
    if(!Array.isArray(data))throw new Error('songs.json must be an array');
    localTracks=data.map(x=>{
      if(typeof x==='string'){
        const raw=x.replace(/^\.\//,'');
        const src=raw.includes('/')?raw:('songs/'+raw);
        const file=raw.split('/').pop();
        return {title:decodeURIComponent(file.replace(/\.[^.]+$/,'')),src:new URL(src,document.baseURI).href};
      }
      if(x&&typeof x.src==='string'){
        const raw=x.src.replace(/^\.\//,'');
        return {title:(typeof x.title==='string'&&x.title.trim())?x.title:decodeURIComponent(raw.split('/').pop().replace(/\.[^.]+$/,'')),src:new URL(raw,document.baseURI).href};
      }
      return null;
    }).filter(Boolean);
    if(!localTracks.length)throw new Error('No local tracks');
    tracks=localTracks;idx=0;playMode='local';setTitle(localTracks[0].title);
    $('time').textContent=`Local playlist • ${localTracks.length} गाने`; syncMiniMode();
    renderSongList();
    // Request only the first audio file; never wait for all 58 files to download.
    const a=$('localAudio');a.preload='auto';a.src=localTracks[0].src;a.load();
    const attempt=a.play();
    if(attempt&&attempt.then)attempt.then(()=>{$('playIc').innerHTML=PAUSE;$('time').textContent='Local गाना चल रहा है';}).catch(()=>{$('playIc').innerHTML=PLAY;$('time').textContent='Play दबाएँ';});
  }catch(e){
    console.error(e);localTracks=[];tracks=[];renderSongList();setTitle('Local गाने उपलब्ध नहीं');
    $('time').textContent=location.protocol==='file:'?'START-MUSICAL-AUTO-SEVA.bat चलाएँ':'songs.json नहीं मिला';
    toast(location.protocol==='file:'?'Local music के लिए START-MUSICAL-AUTO-SEVA.bat चलाएँ; file:// से songs.json नहीं पढ़ा जा सकता।':'songs.json या songs/ folder server पर नहीं मिला।');
  }
}

// Drag the compact player by its header; keep it inside the visible viewport.
(function makePlayerDraggable(){
  const card=$('musicMiniCard'), handle=card.querySelector('.yt-mini-head');
  let dragging=false,startX=0,startY=0,baseX=0,baseY=0;
  handle.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    const r=card.getBoundingClientRect(); dragging=true; startX=e.clientX; startY=e.clientY; baseX=r.left; baseY=r.top;
    card.style.left=r.left+'px'; card.style.top=r.top+'px'; card.style.right='auto'; card.style.bottom='auto'; card.style.transform='none';
    handle.setPointerCapture(e.pointerId); handle.style.cursor='grabbing'; e.preventDefault();
  });
  handle.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const r=card.getBoundingClientRect();
    const x=Math.max(4,Math.min(window.innerWidth-r.width-4,baseX+e.clientX-startX));
    const y=Math.max(4,Math.min(window.innerHeight-r.height-4,baseY+e.clientY-startY));
    card.style.left=x+'px'; card.style.top=y+'px';
  });
  const stop=()=>{dragging=false;handle.style.cursor='grab';};
  handle.addEventListener('pointerup',stop); handle.addEventListener('pointercancel',stop);
  window.addEventListener('resize',()=>{const r=card.getBoundingClientRect();card.style.left=Math.max(4,Math.min(window.innerWidth-r.width-4,r.left))+'px';card.style.top=Math.max(4,Math.min(window.innerHeight-r.height-4,r.top))+'px';card.style.right='auto';card.style.bottom='auto';card.style.transform='none';});
})();
$('youtubePlayer').style.display='none'; $('musicMiniCard').classList.remove('youtube-mode'); $('localModeList').classList.add('active'); $('youtubeModeList').classList.remove('active'); syncMiniMode();

/* Always collapse 5 seconds after the last interaction, even if the pointer stays over it.
   Hover/movement expands it; the compact header identifies the active playlist. */
(function autoCollapsePlayer(){
  const card=$('musicMiniCard'); let timer;
  const collapseLater=()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>card.classList.add('auto-collapsed'),5000);
  };
  const expand=()=>{
    card.classList.remove('auto-collapsed');
    collapseLater();
  };
  card.addEventListener('mouseenter',expand);
  card.addEventListener('mousemove',expand,{passive:true});
  card.addEventListener('mouseleave',collapseLater);
  card.addEventListener('focusin',expand);
  card.addEventListener('focusout',collapseLater);
  ['click','pointerdown','touchstart','keydown'].forEach(ev=>card.addEventListener(ev,expand,{passive:true}));
  collapseLater();
})();

/* top buttons */

let amb = false;

let rainOn = false;

let autoVolume = 0.7;

let rainVolume = 0.6;

function updateVolumeLabels(){

  $('autoVolValue').textContent = Math.round(autoVolume*100) + '%';

  $('rainVolValue').textContent = Math.round(rainVolume*100) + '%';

}

function setAutoVolume(value){

  autoVolume = Math.max(0, Math.min(1, value));

  autoEngine.volume = autoVolume;

  autoEngine.muted = autoVolume === 0;

  updateVolumeLabels();

}

function setRainVolume(value){

  rainVolume = Math.max(0, Math.min(1, value));

  rainSound.volume = rainVolume;

  rainSound.muted = rainVolume === 0;

  updateVolumeLabels();

}

// Wire up both sets of volume controls (10% per tap).
$('autoVolumeSlider').addEventListener('input', e => setAutoVolume(Number(e.target.value)/100));
$('rainVolumeSlider').addEventListener('input', e => setRainVolume(Number(e.target.value)/100));

// Apply initial levels immediately so both sounds start at their displayed volume.
setAutoVolume(autoVolume);
setRainVolume(rainVolume);

$('amb').onclick = async ()=>{
  amb = !amb;
  $('amb').classList.toggle('off', !amb);
  try {
    if (amb) {
      autoEngine.volume = autoVolume;
      await autoEngine.play();
      toast("ऑटो इंजन की आवाज़ चालू");
    } else {
      autoEngine.pause();
      autoEngine.currentTime = 0;
    }
  } catch (error) {
    amb = false;
    $('amb').classList.add('off');
    toast("ऑटो की आवाज़ नहीं चली — sounds/auto-engine.mp3 फ़ाइल जाँचें।");
    console.error("Auto engine sound failed:", error);
  }
};
$('rainToggle').onclick = async ()=>{
  rainOn = !rainOn;
  $('rainBg').classList.toggle('active', rainOn);
  $('rainToggle').classList.toggle('off', !rainOn);
  try {
    if (rainOn) {
      rainSound.volume = rainVolume;
      await rainSound.play();
      rainBg.play().catch(()=>{});
      toast("बारिश की आवाज़ चालू");
    } else {
      rainSound.pause();
      rainSound.currentTime = 0;
      rainBg.muted = true;
    }
  } catch (error) {
    rainOn = false;
    $('rainToggle').classList.add('off');
    $('rainBg').classList.remove('active');
    toast("बारिश की आवाज़ नहीं चली — sounds/rain.mp3 फ़ाइल जाँचें।");
    console.error("Rain sound failed:", error);
  }
};

function applyMusicVolume(){const v=Math.round(musicVolume*100);$('musicVolumeSlider').value=v;$('musicVolumeValue').textContent=v+'%';const a=$('localAudio');a.volume=musicVolume;if(ytReady&&ytPlayer)try{ytPlayer.setVolume(v);ytPlayer.unMute();if(v===0)ytPlayer.mute();}catch(e){}}
$('mute').title='Music volume';$('mute').onclick=()=>{$('musicVolumePop').classList.toggle('open');applyMusicVolume();};
